name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Linux .so
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu
      - run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev
      - run: cargo build --release --lib --target x86_64-unknown-linux-gnu
      - uses: actions/upload-artifact@v4
        with:
          name: libthaiidcard-linux-amd64
          path: target/x86_64-unknown-linux-gnu/release/libthaiidcard.so

  build-mac-arm64:
    name: macOS .dylib (ARM64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
      - run: cargo build --release --lib --target aarch64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: libthaiidcard-macos-arm64
          path: target/aarch64-apple-darwin/release/libthaiidcard.dylib

  build-mac-x64:
    name: macOS .dylib (x86_64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-apple-darwin
      - run: cargo build --release --lib --target x86_64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: libthaiidcard-macos-x86_64
          path: target/x86_64-apple-darwin/release/libthaiidcard.dylib

  build-windows:
    name: Windows .dll
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - run: cargo build --release --lib --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: thaiidcard-windows-amd64
          path: target/x86_64-pc-windows-msvc/release/thaiidcard.dll

  release:
    name: Create Release
    needs:
      - build-linux
      - build-mac-arm64
      - build-mac-x64
      - build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - run: |
          mkdir artifacts
          cp libthaiidcard-linux-amd64/* artifacts/
          cp libthaiidcard-macos-arm64/* artifacts/
          cp libthaiidcard-macos-x86_64/* artifacts/
          cp thaiidcard-windows-amd64/* artifacts/
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
