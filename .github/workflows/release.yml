name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Linux .so (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu
      - run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev
      - run: cargo build --release --lib --target x86_64-unknown-linux-gnu
      - run: cp target/x86_64-unknown-linux-gnu/release/libthaiidcard.so libthaiidcard-linux-x86_64.so
      - uses: actions/upload-artifact@v4
        with:
          name: libthaiidcard-linux-x86_64
          path: libthaiidcard-linux-x86_64.so

  build-linux-arm64:
    name: Linux .so (ARM64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build via Docker
        run: |
          docker build --build-arg TARGET=aarch64-unknown-linux-gnu \
            -f Dockerfile.build -t thaiidcard-builder-linux-arm64 .
          docker run --rm -v $(pwd):/build thaiidcard-builder-linux-arm64
      - run: cp target/aarch64-unknown-linux-gnu/release/libthaiidcard.so libthaiidcard-linux-arm64.so
      - uses: actions/upload-artifact@v4
        with:
          name: libthaiidcard-linux-arm64
          path: libthaiidcard-linux-arm64.so

  build-mac-x64:
    name: macOS .dylib (x86_64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-apple-darwin
      - run: cargo build --release --lib --target x86_64-apple-darwin
      - run: cp target/x86_64-apple-darwin/release/libthaiidcard.dylib libthaiidcard-macos-x86_64.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: libthaiidcard-macos-x86_64
          path: libthaiidcard-macos-x86_64.dylib

  build-mac-arm64:
    name: macOS .dylib (ARM64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
      - run: cargo build --release --lib --target aarch64-apple-darwin
      - run: cp target/aarch64-apple-darwin/release/libthaiidcard.dylib libthaiidcard-macos-arm64.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: libthaiidcard-macos-arm64
          path: libthaiidcard-macos-arm64.dylib

  build-windows:
    name: Windows .dll (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - run: cargo build --release --lib --target x86_64-pc-windows-msvc
      - run: cp target/x86_64-pc-windows-msvc/release/thaiidcard.dll thaiidcard-windows-x86_64.dll
      - uses: actions/upload-artifact@v4
        with:
          name: thaiidcard-windows-x86_64
          path: thaiidcard-windows-x86_64.dll

  build-windows-arm64:
    name: Windows .dll (ARM64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-pc-windows-msvc
      - run: cargo build --release --lib --target aarch64-pc-windows-msvc
      - run: cp target/aarch64-pc-windows-msvc/release/thaiidcard.dll thaiidcard-windows-arm64.dll
      - uses: actions/upload-artifact@v4
        with:
          name: thaiidcard-windows-arm64
          path: thaiidcard-windows-arm64.dll

  release:
    name: Create Release
    needs:
      - build-linux
      - build-linux-arm64
      - build-mac-x64
      - build-mac-arm64
      - build-windows
      - build-windows-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - run: |
          mkdir artifacts
          cp -r libthaiidcard-*/libthaiidcard-*.* artifacts/
          cp -r thaiidcard-*/thaiidcard-*.* artifacts/
          ls -lh artifacts/
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
